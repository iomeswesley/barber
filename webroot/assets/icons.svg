<!--
  Sprite de ícones da plataforma — traço fino (outline), monocromático,
  sem fill/stroke definidos nos <symbol> pra herdar currentColor/fill:none
  de quem consome via <use> (ver .icon em theme.css). Injetado no <body>
  de cada página (exceto chat.html) por assets/icons.js.

  Convenção: viewBox 0 0 24 24, formas desenhadas pra funcionar com
  stroke-width ~2 e linecap/linejoin round (aplicados via CSS, não aqui).
-->
