<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Confirmar horário</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e1d1b'/><g transform='translate(16.4 16.4) scale(2.8)'><path fill='white' d='M6 6m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0'/><path fill='white' d='M6 18m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0'/><path fill='white' stroke='white' stroke-width='1.5' d='M20 4L8.12 15.88'/><path fill='white' stroke='white' stroke-width='1.5' d='M14.47 14.48L20 20'/><path fill='white' stroke='white' stroke-width='1.5' d='M8.12 8.12L12 12'/></g></svg>" />
<meta name="theme-color" content="#f8f9fa" />
<script src="/assets/theme-init.js"></script>
<script src="/assets/icons.js" defer></script>
<link rel="stylesheet" href="/assets/theme.css">
<style>
  body { display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; z-index: 0; }
  .card { width: 100%; max-width: 360px; padding: 32px 28px; text-align: center; }
  .icon-badge {
    width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 24px; margin: 0 auto 16px;
  }
  .icon-badge.ok { background: var(--good-soft); color: var(--good); }
  .icon-badge.invalid { background: var(--danger-soft); color: var(--danger); }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { color: var(--text-secondary); font-size: 13.5px; line-height: 1.55; margin: 0; }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 22px;
    color: var(--text-muted); font-size: 12.5px; text-decoration: none;
  }
  .back-link:hover { color: var(--brand); }
</style>
</head>
<body>

  <div class="card" id="card">
    <!-- preenchido via JS logo abaixo, conforme ?status= -->
  </div>

<script>
// Confirmação já acontece no servidor (GET /api/public/appointments/confirm
// redireciona pra cá com ?status=ok|invalid) — essa página só mostra o
// resultado, sem chamada de API própria.
const status = new URLSearchParams(location.search).get("status");
const card = document.getElementById("card");
const ok = status === "ok";
card.innerHTML = `
  <div class="icon-badge ${ok ? "ok" : "invalid"}">
    <svg class="icon" style="width:26px;height:26px;"><use href="#icon-${ok ? "check-circle" : "alert-triangle"}"></use></svg>
  </div>
  <h1>${ok ? "Presença confirmada!" : "Link inválido ou já usado"}</h1>
  <p>${ok
    ? "Seu horário está confirmado. Te esperamos! Se precisar remarcar, é só chamar no WhatsApp."
    : "Esse link já foi usado ou não é mais válido. Se ainda precisa confirmar seu horário, chame no WhatsApp da barbearia."}</p>
`;
</script>
</body>
</html>
