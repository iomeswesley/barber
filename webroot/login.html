<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%232fa04f'/><stop offset='55%25' stop-color='%231e8e3e'/><stop offset='100%25' stop-color='%230d652d'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><text x='50' y='70' font-size='56' text-anchor='middle'>%F0%9F%92%88</text></svg>" />
<meta name="theme-color" content="#f8f9fa" />
<script src="/assets/theme-init.js"></script>
<link rel="stylesheet" href="/assets/theme.css">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    z-index: 0;
  }
  .card {
    width: 100%;
    max-width: 360px;
    padding: 32px 28px;
  }
  .logo {
    width: 46px; height: 46px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; margin: 0 auto 14px;
    background: var(--brand-grad-logo);
  }
  h1 { font-size: 18px; text-align: center; margin: 0 0 4px; }
  p.hint { text-align: center; color: var(--text-muted); font-size: 12.5px; margin: 0 0 22px; }
  label { font-size: 12px; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: 5px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--card-border); background: var(--surface-raise);
    color: var(--text-primary); font-size: 14px; margin-bottom: 16px;
    transition: border-color .2s ease;
  }
  input:focus { outline: none; border-color: var(--brand); }
  button {
    width: 100%; padding: 11px; border: none; border-radius: 10px;
    background: var(--brand-grad);
    color: var(--brand-ink); font-weight: 700; font-size: 14px; cursor: pointer;
    transition: transform .15s ease, filter .2s ease;
  }
  button:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .error {
    background: var(--danger-soft); color: var(--danger);
    padding: 8px 12px; border-radius: 8px; font-size: 12.5px;
    margin-bottom: 14px; display: none;
  }
  .demo-box {
    margin-top: 20px; padding: 12px; border-radius: 10px;
    background: var(--surface-raise); border: 1px solid var(--card-border);
    font-size: 11.5px; color: var(--text-muted); line-height: 1.6;
  }
  .demo-box b { color: var(--text-primary); }
  .signup-link { display: block; text-align: center; margin-top: 18px; color: var(--text-muted); font-size: 12px; text-decoration: none; }
  .signup-link:hover { color: var(--brand); }
</style>
</head>
<body>

  <div class="card">
    <div class="logo">💈</div>
    <h1>Painel da Barbearia</h1>
    <p class="hint">Entre com seu usuário e senha</p>
    <div class="error" id="error-box"></div>
    <div id="verify-notice" style="display:none; padding:8px 12px; border-radius:8px; font-size:12.5px; margin-bottom:14px;"></div>
    <form id="login-form">
      <label>Usuário</label>
      <input id="username" type="text" autocomplete="username" />
      <label>Senha</label>
      <input id="password" type="password" autocomplete="current-password" />
      <a href="/esqueci-senha.html" class="signup-link" style="margin:-8px 0 16px; text-align:right;">Esqueci minha senha</a>
      <button type="submit">Entrar</button>
    </form>
    <div class="demo-box">
      <b>Usuários de demonstração</b> (senha para todos: <b>barbearia123</b>):<br>
      Dono: <b>barbearia-vintage.dono</b> ou <b>barber-king.dono</b><br>
      Barbeiro: <b>carlos</b>, <b>rafael</b>, <b>diego</b>, <b>lucas</b> ou <b>bruno</b>
    </div>
    <a class="signup-link" href="/signup.html">Ainda não tem conta? Cadastre sua barbearia</a>
    <p style="text-align:center; margin:14px 0 0; font-size:10.5px; color:var(--text-muted);">
      <a href="/privacidade.html" style="color:inherit;">Privacidade</a> · <a href="/termos.html" style="color:inherit;">Termos</a>
    </p>
  </div>

<script>
const form = document.getElementById("login-form");
const errorBox = document.getElementById("error-box");

const verified = new URLSearchParams(location.search).get("verified");
if (verified) {
  const notice = document.getElementById("verify-notice");
  if (verified === "1") {
    notice.textContent = "E-mail confirmado! Pode entrar normalmente.";
    notice.style.background = "var(--good-soft)";
    notice.style.color = "var(--good)";
  } else if (verified === "expired") {
    notice.textContent = "Esse link de confirmação expirou. Entre e peça pra reenviar.";
    notice.style.background = "var(--warn-soft)";
    notice.style.color = "var(--warn)";
  } else {
    notice.textContent = "Não foi possível confirmar o e-mail.";
    notice.style.background = "var(--danger-soft)";
    notice.style.color = "var(--danger)";
  }
  notice.style.display = "block";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorBox.style.display = "none";
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorBox.textContent = data.error || "Não foi possível entrar.";
      errorBox.style.display = "block";
      return;
    }
    window.location.href = data.redirect;
  } catch (err) {
    errorBox.textContent = "Erro de conexão com o servidor.";
    errorBox.style.display = "block";
  }
});
</script>
</body>
</html>
