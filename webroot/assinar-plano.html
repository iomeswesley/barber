<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Assinar plano</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%232fa04f'/><stop offset='55%25' stop-color='%231e8e3e'/><stop offset='100%25' stop-color='%230d652d'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><g transform='translate(16.4 16.4) scale(2.8)'><path fill='white' d='M6 6m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0'/><path fill='white' d='M6 18m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0'/><path fill='white' stroke='white' stroke-width='1.5' d='M20 4L8.12 15.88'/><path fill='white' stroke='white' stroke-width='1.5' d='M14.47 14.48L20 20'/><path fill='white' stroke='white' stroke-width='1.5' d='M8.12 8.12L12 12'/></g></svg>" />
<meta name="theme-color" content="#faf9f7" />
<script src="/assets/theme-init.js"></script>
<link rel="stylesheet" href="/assets/theme.css">
<script src="/assets/icons.js" defer></script>
<style>
  body { padding: 24px 16px; position: relative; z-index: 0; }

  .wrap { max-width: 440px; margin: 0 auto; }
  .logo-row { text-align: center; margin-bottom: 18px; }
  .logo { width: 46px; height: 46px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; background: var(--brand-grad-logo); color: var(--brand-ink); }
  h1 { font-size: 18px; text-align: center; margin: 12px 0 4px; }
  p.hint { text-align: center; color: var(--text-muted); font-size: 12.5px; margin: 0 0 22px; }

  .card { padding: 24px 22px; margin-bottom: 16px; }
  label { font-size: 12px; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: 5px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--card-border); background: var(--card-bg-solid);
    color: var(--text-primary); font-size: 13px; margin-bottom: 14px;
    transition: border-color .2s ease;
  }
  input:focus { outline: none; border-color: var(--brand); }
  button.primary {
    width: 100%; padding: 11px; border: none; border-radius: 10px;
    background: var(--brand); color: var(--brand-ink); font-weight: 700; font-size: 13px; cursor: pointer;
    transition: background-color .2s ease;
  }
  button.primary:hover { background: var(--brand-hover); }
  button.primary:disabled { opacity: .6; cursor: default; }
  button.secondary {
    width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--card-border);
    background: transparent; color: var(--text-primary); font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: border-color .2s ease, color .2s ease;
  }
  button.secondary:hover { border-color: var(--card-border-hover); color: var(--brand); }

  .error { background: var(--danger-soft); color: var(--danger); padding: 8px 12px; border-radius: 8px; font-size: 12.5px; margin-bottom: 14px; display: none; }
  .empty-state { text-align: center; padding: 24px 10px; color: var(--text-muted); font-size: 12.5px; }

  .plan-shop { text-align: center; font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .plan-name { text-align: center; font-size: 20px; font-weight: 800; margin: 4px 0 6px; }
  .plan-price { text-align: center; font-size: 28px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 4px; }
  .plan-price span { font-size: 13px; font-weight: 600; color: var(--text-muted); }
  .plan-benefit { text-align: center; font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; }

  .status-icon { width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .status-icon.success { background: var(--good-soft); color: var(--good); }
  .status-icon.cancel { background: var(--warn-soft); color: var(--warn); }
  .status-title { text-align: center; font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .status-text { text-align: center; font-size: 13px; color: var(--text-secondary); line-height: 1.55; margin-bottom: 18px; }

  .link-back { display: block; text-align: center; margin-top: 20px; color: var(--text-muted); font-size: 12px; text-decoration: none; }
  .link-back:hover { color: var(--brand); }
</style>
</head>
<body>

<div class="wrap">
  <div class="logo-row"><div class="logo"><svg class="icon"><use href="#icon-brand-razor"></use></svg></div></div>

  <div id="content"></div>

  <a class="link-back" href="/minha-conta.html"><svg class="icon"><use href="#icon-arrow-left"></use></svg> Ver meus agendamentos</a>
</div>

<script>
function currency(v) { return new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 }).format(v || 0); }

const params = new URLSearchParams(location.search);
const planId = params.get("plan");
const status = params.get("status");
const content = document.getElementById("content");

function renderMissingPlan() {
  content.innerHTML = `
    <h1>Link inválido</h1>
    <div class="card"><div class="empty-state">Esse link não tem um plano válido. Peça um link novo pra barbearia.</div></div>
  `;
}

function renderStatus() {
  const isSuccess = status === "success";
  content.innerHTML = `
    <div class="card">
      <div class="status-icon ${isSuccess ? "success" : "cancel"}">
        <svg class="icon" style="width:24px;height:24px;"><use href="#icon-${isSuccess ? "check-circle" : "alert-triangle"}"></use></svg>
      </div>
      <div class="status-title">${isSuccess ? "Assinatura em andamento!" : "Pagamento não foi concluído"}</div>
      <div class="status-text">
        ${isSuccess
          ? "Estamos confirmando o pagamento com o Stripe — você recebe uma mensagem no WhatsApp assim que a assinatura for ativada, geralmente em poucos segundos."
          : "Você saiu do pagamento antes de terminar. Pode tentar de novo quando quiser, o plano continua disponível."}
      </div>
      ${isSuccess ? "" : `<button class="primary" id="retry-btn">Tentar de novo</button>`}
    </div>
  `;
  if (!isSuccess) {
    document.getElementById("retry-btn").addEventListener("click", () => {
      location.href = `/assinar-plano.html?plan=${planId}`;
    });
  }
}

const BENEFIT_LABELS = {
  services_included: (v) => `${v} serviço(s) incluído(s) por mês`,
  percent_discount: (v) => `${v}% de desconto em qualquer serviço`,
  unlimited_service: () => `Acesso ilimitado a 1 serviço`,
};

async function renderSubscribeForm() {
  const res = await fetch(`/api/public/client-plans/${planId}`);
  if (!res.ok) {
    renderMissingPlan();
    return;
  }
  const plan = await res.json();
  content.innerHTML = `
    <h1>Assinar plano</h1>
    <p class="hint">Preencha seus dados pra confirmar a assinatura</p>
    <div class="card">
      <div class="plan-shop">${plan.business_name}</div>
      <div class="plan-name">${plan.name}</div>
      <div class="plan-price">${currency(plan.price_cents / 100)}<span>/mês</span></div>
      <div class="plan-benefit">${plan.benefit_description || BENEFIT_LABELS[plan.benefit_type](plan.benefit_value)}</div>
      <div class="error" id="error-box"></div>
      <label>Seu nome</label>
      <input type="text" id="subscribe-name" />
      <label>Seu telefone (com DDD)</label>
      <input type="text" id="subscribe-phone" placeholder="Ex: 11999998888" />
      <button class="secondary" id="send-code-btn">Enviar código por WhatsApp</button>
      <div id="code-step" style="display:none; margin-top:14px;">
        <label>Código recebido no WhatsApp</label>
        <input type="text" id="subscribe-code" maxlength="6" placeholder="000000" />
        <button class="secondary" id="confirm-code-btn">Confirmar código</button>
      </div>
      <button class="primary" id="go-checkout-btn" style="display:none; margin-top:14px;">Ir pro pagamento</button>
    </div>
  `;

  function showError(msg) {
    const box = document.getElementById("error-box");
    box.textContent = msg;
    box.style.display = "block";
  }
  function hideError() {
    document.getElementById("error-box").style.display = "none";
  }

  document.getElementById("send-code-btn").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    const phone = document.getElementById("subscribe-phone").value.replace(/\D/g, "");
    if (!phone) { showError("Informe seu telefone."); return; }
    hideError();
    btn.disabled = true;
    btn.textContent = "Enviando...";
    const res = await fetch("/api/public/client-plans/verify/start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone, businessId: plan.barbershop_id }),
    });
    btn.disabled = false;
    btn.textContent = "Enviar código por WhatsApp";
    if (!res.ok) {
      const err = await res.json();
      showError(err.error || "Erro ao enviar código");
      return;
    }
    document.getElementById("code-step").style.display = "block";
  });

  document.getElementById("confirm-code-btn").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    const phone = document.getElementById("subscribe-phone").value.replace(/\D/g, "");
    const code = document.getElementById("subscribe-code").value.trim();
    if (!code) { showError("Informe o código recebido."); return; }
    hideError();
    btn.disabled = true;
    btn.textContent = "Confirmando...";
    const res = await fetch("/api/public/client-plans/verify/confirm", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone, code }),
    });
    btn.disabled = false;
    btn.textContent = "Confirmar código";
    if (!res.ok) {
      const err = await res.json();
      showError(err.error || "Código incorreto");
      return;
    }
    document.getElementById("go-checkout-btn").style.display = "block";
  });

  document.getElementById("go-checkout-btn").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    const phone = document.getElementById("subscribe-phone").value.replace(/\D/g, "");
    const name = document.getElementById("subscribe-name").value.trim();
    if (!name) { showError("Informe seu nome."); return; }
    hideError();
    btn.disabled = true;
    btn.textContent = "Redirecionando...";
    const res = await fetch(`/api/public/client-plans/${planId}/checkout`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone, name }),
    });
    if (!res.ok) {
      const err = await res.json();
      showError(err.error || "Erro ao iniciar pagamento");
      btn.disabled = false;
      btn.textContent = "Ir pro pagamento";
      return;
    }
    const body = await res.json();
    window.location.href = body.url;
  });
}

if (!planId) {
  renderMissingPlan();
} else if (status === "success" || status === "cancel") {
  renderStatus();
} else {
  renderSubscribeForm();
}
</script>
</body>
</html>
